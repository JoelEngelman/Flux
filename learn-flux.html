<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Learn Flux</title><style>
*{box-sizing:border-box}body{margin:0;background:#07080c;color:#f5f7ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:1050px;margin:auto;padding:28px 20px 80px}.top{display:flex;justify-content:space-between;align-items:center}.logo{font-weight:900;font-size:24px}.logo b{color:#9b7cff}.link{color:#ddd;text-decoration:none;padding:10px 14px;border:1px solid #ffffff18;border-radius:12px;background:#ffffff08}.hero{text-align:center;padding:65px 0 35px}.hero h1{font-size:clamp(44px,8vw,82px);letter-spacing:-4px;margin:0}.hero p{color:#9da4b5;font-size:18px}.progress{height:8px;background:#ffffff12;border-radius:99px;overflow:hidden;margin:25px 0}.progress i{display:block;height:100%;width:0;background:#8b5cf6;transition:.3s}.card{background:#ffffff08;border:1px solid #ffffff14;border-radius:24px;padding:30px;box-shadow:0 25px 80px #0007}.lesson{display:none}.lesson.active{display:block}.num{color:#a98cff;font-weight:800}.lesson h2{font-size:36px;margin:8px 0 15px}.lesson p{color:#c0c5d1;line-height:1.7}.code{background:#090b10;border:1px solid #ffffff12;border-radius:14px;padding:18px;color:#b9f5d7;font:14px/1.7 monospace;white-space:pre-wrap}.tip{background:#8b5cf615;border-left:4px solid #8b5cf6;padding:14px 16px;border-radius:10px;color:#d9d1ff;margin:18px 0}.question{margin-top:25px;padding-top:20px;border-top:1px solid #ffffff12}.answers{display:grid;gap:10px}.answer{padding:14px 16px;text-align:left;border-radius:12px;border:1px solid #ffffff18;background:#ffffff08;color:#fff;cursor:pointer}.answer:hover{background:#ffffff12}.answer.correct{background:#174b35;border-color:#36c98b}.answer.wrong{background:#51242b;border-color:#ff687b}.feedback{min-height:25px;margin:12px 0;font-weight:700}.next{margin-top:20px;border:0;border-radius:12px;padding:13px 20px;background:#8b5cf6;color:#fff;font-weight:800;cursor:pointer}.next:disabled{opacity:.35;cursor:not-allowed}.finish{text-align:center;display:none}.badge{font-size:60px}.score{font-size:28px;font-weight:900}.small{color:#7f8798;font-size:13px}.nav{display:flex;justify-content:space-between;margin-top:18px}@media(max-width:600px){.card{padding:20px}.lesson h2{font-size:29px}}
</style></head><body><div class="wrap"><div class="top"><div class="logo"><b>F</b>lux Academy</div><a class="link" href="playground.html">Open Playground →</a></div><section class="hero"><h1>Learn Flux.</h1><p>A hands-on course. Read, answer, build, and prove you understand it.</p><div class="progress"><i id="bar"></i></div><div id="count" class="small">Lesson 1 of 12</div></section><main class="card" id="course"></main><div class="finish" id="finish"><div class="badge">⚡</div><h2>You completed Learn Flux!</h2><div class="score" id="final"></div><p>Now take what you learned into the Flux Playground.</p><a class="next" href="playground.html">Build with Flux →</a></div></div><script>
const lessons=[
['01','What is Flux?','Flux is a programming language designed to make building interactive software approachable. It can describe logic, visual interfaces, games and more. Flux is not Python with a new name: its syntax and runtime are designed around Flux concepts.','say "Hello, Flux!"','Which keyword prints a message in Flux?',['print','say','echo','write'],1],
['02','Values and variables','A variable stores a value. Flux uses make to create one. Variables can hold text, numbers and other data supported by the runtime.','make score = 100\nsay score','What does make score = 100 do?',['Deletes score','Creates score with value 100','Runs score as a function','Creates a website'],1],
['03','Text','Text is written inside quotes. Flux can display text with say.','make name = "Joel"\nsay "Hello " + name','Which is a text value?',['42','true','"Flux"','[1,2,3]'],2],
['04','Numbers and maths','Flux can work with numbers and arithmetic. Use expressions to calculate values rather than hard-coding every answer.','make total = 10 + 5\nsay total','What should total contain?',['15','105','10 + 5 as text','5'],0],
['05','Decisions','Programs need to make choices. Flux uses if/else-style logic so a program can react to conditions.','if score >= 50\n    say "Pass"\nelse\n    say "Try again"\ndone','If score is 80, what is displayed?',['Try again','Pass','80','Nothing'],1],
['06','Loops','Loops repeat work. They are useful when something must happen many times without copying the same code.','repeat 3\n    say "Flux"\ndone','How many times does the example say Flux?',['1','2','3','Forever'],2],
['07','Functions','Functions package reusable behaviour. Instead of repeating a block, you can define it once and call it when needed.','function greet(name)\n    say "Hello " + name\ndone\ngreet("Alex")','Why use a function?',['To make code reusable','To delete variables','To change the computer language','To stop all programs'],0],
['08','Lists','Lists let a program keep several values together. They are useful for inventories, questions, players and many other things.','make fruits = ["apple", "pear", "grape"]','How many values are in fruits?',['1','2','3','4'],2],
['09','Events','Interactive software reacts to events. A button click, key press or other action can trigger code.','ui button "Start"\n    on_click\n        say "Game started!"\n    done\ndone','What happens when Start is clicked?',['The program closes','It says Game started!','The button disappears','Nothing'],1],
['10','Visual UI','Flux can describe visual output. UI commands can create windows, text, buttons, backgrounds and other components.','ui background "#101827"\nui text "Welcome to Flux"','What does the colour value #101827 represent?',['A number','A hexadecimal colour','A variable','A file'],1],
['11','Games','Games combine variables, decisions, loops, functions, events and UI. Flux can describe game rules while its runtime renders the interactive experience.','game Connections\ngroup "Fruit"\n    apple\n    pear\n    grape\n    banana\ndone','What does a group define in this example?',['A category of four words','A computer folder','A colour','A loop'],0],
['12','Build mode','You now have the foundations: values, logic, loops, functions, data, events and visual UI. The best way to learn Flux is to build something and experiment.','ui window "My App"\nui background "#08090d"\nui text "I built this with Flux!"\nui button "Start"','What should you do after finishing the course?',['Never write code again','Open the Playground and build','Delete Flux','Only read documentation'],1]
];
let index=0,score=0,answered=false;const course=document.getElementById('course');function render(){const l=lessons[index];answered=false;course.innerHTML=`<div class="lesson active"><div class="num">LESSON ${l[0]} / ${lessons.length}</div><h2>${l[1]}</h2><p>${l[2]}</p><div class="code">${escape(l[3])}</div><div class="tip">💡 Read the code carefully, then answer the challenge below.</div><div class="question"><h3>${l[4]}</h3><div class="answers">${l[5].map((a,i)=>`<button class="answer" data-i="${i}">${a}</button>`).join('')}</div><div class="feedback" id="feedback"></div><button class="next" id="next" disabled>${index===lessons.length-1?'Finish course':'Next lesson →'}</button></div></div>`;document.querySelectorAll('.answer').forEach(b=>b.onclick=()=>answer(+b.dataset.i));document.getElementById('next').onclick=next;updateProgress()};function escape(s){return s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')};function answer(i){if(answered)return;answered=true;const l=lessons[index],buttons=document.querySelectorAll('.answer');buttons.forEach((b,n)=>{if(n===l[6])b.classList.add('correct');if(n===i&&i!==l[6])b.classList.add('wrong');b.disabled=true});const f=document.getElementById('feedback');if(i===l[6]){score++;f.textContent='✅ Correct!';f.style.color='#63e6ad'}else f.textContent='❌ Not quite — the correct answer is highlighted.';document.getElementById('next').disabled=false};function next(){if(!answered)return;if(index===lessons.length-1){course.style.display='none';document.getElementById('finish').style.display='block';document.getElementById('final').textContent=`${score} / ${lessons.length} correct — ${Math.round(score/lessons.length*100)}%`;document.getElementById('count').textContent='Course complete';document.getElementById('bar').style.width='100%';return}index++;render()};function updateProgress(){document.getElementById('bar').style.width=(index/lessons.length*100)+'%';document.getElementById('count').textContent=`Lesson ${index+1} of ${lessons.length}`};render();
</script></body></html>
